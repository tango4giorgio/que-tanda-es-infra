name: Deploy infrastructure

on:
  workflow_dispatch:
    inputs:
      backend_release_tag:
        description: Backend release tag whose Lambda packages will be deployed
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-infrastructure
  cancel-in-progress: false

jobs:
  deploy:
    name: Plan and apply
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      AWS_REGION: eu-west-2
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_backend_release_tag: ${{ inputs.backend_release_tag }}
      TF_VAR_supabase_access_token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TF_VAR_supabase_database_password: ${{ secrets.SUPABASE_DATABASE_PASSWORD }}
      TF_VAR_supabase_organization_id: ${{ vars.SUPABASE_ORGANIZATION_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.4

      - name: Check required configuration
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
          SUPABASE_ORGANIZATION_ID: ${{ vars.SUPABASE_ORGANIZATION_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DATABASE_PASSWORD: ${{ secrets.SUPABASE_DATABASE_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$AWS_ROLE_ARN" ]] || { echo "::error::AWS_ROLE_ARN is not configured on the production environment."; exit 1; }
          [[ -n "$TF_STATE_BUCKET" ]] || { echo "::error::TF_STATE_BUCKET is not configured on the production environment."; exit 1; }
          [[ -n "$TF_LOCK_TABLE" ]] || { echo "::error::TF_LOCK_TABLE is not configured on the production environment."; exit 1; }
          [[ -n "$SUPABASE_ORGANIZATION_ID" ]] || { echo "::error::SUPABASE_ORGANIZATION_ID is not configured on the production environment."; exit 1; }
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || { echo "::error::SUPABASE_ACCESS_TOKEN is not configured on the production environment."; exit 1; }
          [[ -n "$SUPABASE_DATABASE_PASSWORD" ]] || { echo "::error::SUPABASE_DATABASE_PASSWORD is not configured on the production environment."; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: github-actions-terraform

      - name: Initialise Terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=backend-infra/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Validate configuration
        run: terraform validate

      - name: Create deployment plan
        run: terraform plan -out=tfplan

      - name: Apply deployment plan
        run: terraform apply -auto-approve tfplan
