name: Create application database

on:
  workflow_dispatch:
    inputs:
      existing_project_ref:
        description: Optional existing Supabase project reference to import instead of creating a project
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: application-database-creation
  cancel-in-progress: false

jobs:
  create:
    name: Create or import Supabase project
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: database-creation
    defaults:
      run:
        working-directory: app-database
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_supabase_access_token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TF_VAR_supabase_database_password: ${{ secrets.SUPABASE_DATABASE_PASSWORD }}
      TF_VAR_supabase_organization_id: ${{ vars.SUPABASE_ORGANIZATION_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.4

      - name: Check required configuration
        shell: bash
        env:
          SUPABASE_ORGANIZATION_ID: ${{ vars.SUPABASE_ORGANIZATION_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DATABASE_PASSWORD: ${{ secrets.SUPABASE_DATABASE_PASSWORD }}
          SUPABASE_TFSTATE_DATABASE_URL: ${{ secrets.SUPABASE_TFSTATE_DATABASE_URL }}
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_ORGANIZATION_ID" ]] || { echo "::error::SUPABASE_ORGANIZATION_ID is not configured on the database-creation environment."; exit 1; }
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || { echo "::error::SUPABASE_ACCESS_TOKEN is not configured on the database-creation environment."; exit 1; }
          [[ -n "$SUPABASE_DATABASE_PASSWORD" ]] || { echo "::error::SUPABASE_DATABASE_PASSWORD is not configured on the database-creation environment."; exit 1; }
          [[ -n "$SUPABASE_TFSTATE_DATABASE_URL" ]] || { echo "::error::SUPABASE_TFSTATE_DATABASE_URL is not configured on the database-creation environment."; exit 1; }

      - name: Initialise Terraform
        shell: bash
        env:
          SUPABASE_TFSTATE_DATABASE_URL: ${{ secrets.SUPABASE_TFSTATE_DATABASE_URL }}
        run: |
          set -euo pipefail
          cat > app-database.tfbackend <<EOF
          conn_str = "$SUPABASE_TFSTATE_DATABASE_URL"
          schema_name = "application_database_state"
          EOF
          terraform init -backend-config=app-database.tfbackend

      - name: Import existing project
        if: inputs.existing_project_ref != ''
        shell: bash
        env:
          EXISTING_PROJECT_REF: ${{ inputs.existing_project_ref }}
        run: |
          set -euo pipefail
          terraform state show supabase_project.catalogue >/dev/null 2>&1 ||
            terraform import supabase_project.catalogue "$EXISTING_PROJECT_REF"
          terraform state show supabase_settings.catalogue >/dev/null 2>&1 ||
            terraform import supabase_settings.catalogue "$EXISTING_PROJECT_REF"

      - name: Check formatting
        run: terraform fmt -check

      - name: Validate configuration
        run: terraform validate

      - name: Create database plan
        run: terraform plan -out=tfplan

      - name: Apply database plan
        run: terraform apply -auto-approve tfplan

      - name: Publish project reference
        shell: bash
        run: |
          set -euo pipefail
          project_ref="$(terraform output -raw supabase_project_ref)"
          {
            echo "## Application database ready"
            echo
            echo "Set the main infrastructure environment variable:"
            echo
            echo "\`SUPABASE_PROJECT_REF=$project_ref\`"
          } >> "$GITHUB_STEP_SUMMARY"
